  <body>
    <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770.38 1712.33" style="width: 200px;">

      </defs>
      <line class="cls-1" x1="268.3" y1="1132.22" x2="129.64" y2="1710"/>
      <line class="cls-1" x1="268.3" y1="1132.22" x2="385.19" y2="1710"/>
      <path class="cls-1" d="M268.3,1132.22V460c-154.7,8.44-241.83,102.11-254.34,238.89-9.87,107.9,84.26,249.16,185.01,308.33"/>
      <line id="left-arm" class="cls-1" x1="330.86" y1="950.89" x2="268.3" y2="460"/>
      <circle class="cls-1" cx="268.3" cy="229.44" r="219.44"/>
      <rect class="cls-1" x="11.69" y="764.84" width="747" height="233.33" transform="translate(-442.65 391.51) rotate(-35.77)"/>
  </svg>

    <form id="myForm">

        <option value="D3">D</option>
        <option value="D#3">D#</option>
        <option value="E3">E</option>

        <option value="F3">F</option>
        <option value="F#3">F#</option>
        <option value="G3">G</option>
        <option value="G#3">G#</option>
        <hr>
      </select>
      
      <select id="scale-select" name="scale">
        <option value="major">Major</option>
        <option value="minor">Minor</option>
        <option value="dorian">Dorian</option>
        <option value="phrygian">Phrygian</option>
        <option value="lydian">Lydian</option>

      </select> Intervals
      
      <br>
      
      <select id="duration-select" name="scale">
        <option value="1n">Whole Notes</option>
        <option value="2n">Half Notes</option>
        <option value="4n">Quarter Notes</option>
        <option value="8n">Eighth Notes</option>
        <option value="16n" selected>Sixteenth Notes</option>
        <option value="32n">Thirty-Second Notes</option>

        <option value="1t">Whole Triplets</option>

        <option value="4t">Quarter Triplet</option>
        <option value="8t">Eighth Triplets</option>
        <option value="16t">Sixteenth Triplets</option>
        <option value="32t">Thirty-Second Triplets</option>

      Drums? <input id="drums-input" type="checkbox">

      <input id="drums-pitch-input"> Drum Pitch

      <div id="fret-string5">

      </div>
      <div id="fret-string3">
        
      </div>

  <script src="https://unpkg.com/tone"></script>
  <script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
  <script>
    /* ----------- */
    /* Start Music */
    /* ----------- */
    let n;
    let step = 0

    /* Scale Info */
    let root = "G3"
    let scale = mirrorScale(
      [...nn.createScale("A3", "minor-pentatonic", false),
       ...nn.createScale("A4", "minor-pentatonic", true), "C6"]);

    /* Timing Info */
    let interval = "16n";
    let duration = "16n";
    
    /* Drums Info */
    let drumsPitch = "C4";
    
    /* Synth & Transport Setup */
    const synthA = new Tone.FMSynth().toDestination();
    const synthB = new Tone.PluckSynth().toDestination();
    const loopA = new Tone.Loop((time) => {
      n = scale[step % scale.length];
      synthA.triggerAttackRelease(n, duration, time);
      step += 1;
    }, interval).start(0);
    
    const drumLoop = new Tone.Loop((time) => {
      synthB.triggerAttackRelease(drumsPitch, "4n", time);
    }, "4n");
    
    Tone.getTransport().start();
    
    /* ---------------- */
    /* Create Fretboard */
    /* ---------------- */
    let strings = ["E3", "A3", "D4", "G4", "B4", "E5"];

    let fretboard = [[],[],[],[],[],[]];

    let openStrings = ['E2', 'A2', 'D3', 'G3', 'B3', 'E4'];

    for (let i = 0; i < 6; i++) {
      let openNote = nn.noteToMidi(openStrings[i]);
      let stringSelector = '#fret-string' + i;

      for (let j = 0; j <= 24; j++) {
        let newNote = openNote + j;
        let newElement = nn.create('p').content(newNote).addTo(stringSelector);

        let obj = { string: i, fret: j, midi: newNote, el: newElement };
        fretboard[i].push(obj);
      }
    }
    highlightScale();
    
    /* ----- */
    /* Binds */
    /* ----- */
    nn.get('#root-select').on('change', updateRoot);
    nn.get('#scale-select').on('change', updateScale);

    /* Timing */
    nn.get('#interval-select').on('input', updateInterval);
    nn.get('#duration-select').on('input', updateDuration);
    nn.get('#bpm-input').on('input', updateBpm);

    /* Drums */
    nn.get('#drums-input').on('input', updateDrums);
    nn.get('#drums-pitch-input').on('input', updateDrums);
    
    /* ------------------------------- */
    /* Functions for Updating Settings */
    /* ------------------------------- */
    function updateRoot() {
      root = nn.get('#root-select').value;
      updateScale();
    }
    
    function updateScale() {
      octave = Number(scale[0][scale[0].length - 1]) + 1;
      let type = nn.get('#scale-select').value;
      step = 0;

      let rootStripped = nn.stripOctave(root);
      let secondOctave = rootStripped + octave;

      scale = mirrorScale(
      [...nn.createScale(root, type, false),
       ...nn.createScale(secondOctave, type, true)]);
      highlightScale();
    }
    
    function updateInterval() {
      let newInterval = nn.get('#interval-select').value;
      step = 0;
      loopA.stop();
      loopA.interval = newInterval;
      interval = newInterval;
      loopA.start(0);
    }
    
    function updateDuration() {
      let newDuration = nn.get('#duration-select').value;
      step = 0;
      duration = newDuration;
    }
    
    function updateBpm() {
      let speed = nn.get('#bpm-input').value;
      Tone.getTransport().bpm.rampTo(speed, 1);
    }
    
    function updateDrums() {
      let drumsOn = nn.get('#drums-input').checked;
      
      if (!drumsOn) {
        drumLoop.stop(0);
      } else if (drumsPitch !== null) {
        drumLoop.start(0);
      }
    }

    /* -------------- */
    /* Handle Visuals */
    /* -------------- */    
    function highlightScale() {
      for (let guitarString of fretboard) {
        for (let fret of guitarString) {
          let midi = fret.midi;
          let elem = fret.el;

          if (isInScale(midi, scale)) {
            elem.set('style', 'color: limegreen;');
          } else {
            elem.set('style', 'color: black;');
          }
        }
      }
    }

    /* ------------------------- */
    /* Music Theory & Utilities */
    /* ------------------------- */
    function isInScale(target, targetScale) {
      const includedClasses = new Set([]);
  
      for (const note of targetScale) {
        let pitchClass = nn.noteToMidi(note) % 12;
        includedClasses.add(pitchClass)
      }

      return includedClasses.has(target % 12);
    }

    function mirrorScale(scale) {
      let result = [...scale];
      for (let i = scale.length - 2; i > 0; i--) {
        result.push(scale[i])
      }
      return result
    }
    /// e.key
    /// on('keydown', func)
  </script>
</html>
